<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Posts - Simple Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-gray-50 via-purple-50 to-blue-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <ul class="flex space-x-6 text-blue-600 font-medium">
      <li><a href="../Main_Page/Main.html" class="hover:underline">🏠 Home</a></li>
      <li><a href="./Posts.html" class="hover:underline">📝 Posts</a></li>
    </ul>
    <ul>
      <li><a href="../Login_Register/LoginRegister.html" class="text-blue-600 font-medium hover:underline">👤 Account</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-10 fade-in">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-10">📝 All Blog Posts</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Post Card -->
      <div class="bg-white rounded-lg shadow-md p-6 card-hover">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Post Title 1</h2>
        <p class="text-gray-600">This is the content of the first blog post...</p>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6 card-hover">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Post Title 2</h2>
        <p class="text-gray-600">Another exciting entry from our blog...</p>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6 card-hover">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Post Title 3</h2>
        <p class="text-gray-600">Tips and tricks you might find useful...</p>
      </div>

      <!-- More post cards can be added similarly -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t py-4 text-center text-gray-500 text-sm">
    &copy; 2025 Simple Blog. All rights reserved.
  </footer>

</body>
</html>
