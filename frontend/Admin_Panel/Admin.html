<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Simple Blog</title>
</head>
<body>
    <h3>Admin Panel</h3>

    <h4>Your Info</h4>
    <table>
        <tr>
            <th>Id</th>
            <th>Name</th>

            <td>1</td>
