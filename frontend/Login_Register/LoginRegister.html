<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Register - Simple Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-pink-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <ul class="flex space-x-6 text-blue-600 font-medium">
      <li><a href="../Main_Page/Main.html" class="hover:underline">🏠 Home</a></li>
      <li><a href="../Posts/Posts.html" class="hover:underline">📝 Posts</a></li>
    </ul>
    <ul>
      <li><a href="../Login_Register/LoginRegister.html" class="text-blue-600 font-medium hover:underline">👤 Account</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-12 fade-in">

    <h1 class="text-4xl font-bold text-center text-gray-800 mb-10">📝 Login & Register</h1>

    <!-- Flexbox container to align Login and Register side by side -->
    <div class="flex justify-center gap-12">
      <!-- Login Form -->
      <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-sm">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">Login</h2>
        <form action="#" method="POST">
          <div class="mb-4">
            <label for="login-email" class="block text-gray-700">Email</label>
            <input type="email" id="login-email" name="email" class="w-full p-3 mt-2 border border-gray-300 rounded-lg" required />
          </div>
          <div class="mb-4">
            <label for="login-password" class="block text-gray-700">Password</label>
            <input type="password" id="login-password" name="password" class="w-full p-3 mt-2 border border-gray-300 rounded-lg" required />
          </div>
          <div class="flex justify-center">
            <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700 focus:outline-none w-full">Login</button>
          </div>
        </form>
      </div>

      <!-- Register Form -->
      <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-sm">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">Register</h2>
        <form action="#" method="POST">
          <div class="mb-4">
            <label for="register-name" class="block text-gray-700">Full Name</label>
            <input type="text" id="register-name" name="name" class="w-full p-3 mt-2 border border-gray-300 rounded-lg" required />
          </div>
          <div class="mb-4">
            <label for="register-email" class="block text-gray-700">Email</label>
            <input type="email" id="register-email" name="email" class="w-full p-3 mt-2 border border-gray-300 rounded-lg" required />
          </div>
          <div class="mb-4">
            <label for="register-password" class="block text-gray-700">Password</label>
            <input type="password" id="register-password" name="password" class="w-full p-3 mt-2 border border-gray-300 rounded-lg" required />
          </div>
          <div class="flex justify-center">
            <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700 focus:outline-none w-full">Register</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t py-4 text-center text-gray-500 text-sm">
    &copy; 2025 Simple Blog. All rights reserved.
  </footer>

</body>
</html>
