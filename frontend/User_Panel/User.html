<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User - Simple Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-gray-50 via-purple-50 to-blue-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <ul class="flex space-x-6 text-blue-600 font-medium">
      <li><a href="../Main_Page/Main.html" class="hover:underline">🏠 Home</a></li>
      <li><a href="../Posts/Posts.html" class="hover:underline">📝 Posts</a></li>
    </ul>
    <ul>
      <li><a href="../Login_Register/LoginRegister.html" class="text-blue-600 font-medium hover:underline">👤 Account</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-12 fade-in flex-grow">

    <h1 class="text-4xl font-bold text-center text-gray-800 mb-10">👤 User Profile</h1>

    <!-- User Info Section -->
    <section class="bg-white rounded-lg shadow-md p-8 mb-12">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Your Information</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 shadow-md rounded-lg">
          <thead class="bg-gray-100 text-gray-700">
            <tr>
              <th class="px-6 py-3 border-b">Field</th>
              <th class="px-6 py-3 border-b">Details</th>
            </tr>
          </thead>
          <tbody>
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 border-b font-medium">Username</td>
              <td class="px-6 py-4 border-b">john_doe</td>
            </tr>
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 border-b font-medium">Email</td>
              <td class="px-6 py-4 border-b">john@example.com</td>
            </tr>
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 border-b font-medium">Joined</td>
              <td class="px-6 py-4 border-b">January 15, 2025</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- User Actions -->
    <section class="flex justify-center space-x-6 mb-12">
      <button class="bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700 focus:outline-none">Edit Profile</button>
      <button class="bg-red-600 text-white py-2 px-6 rounded-lg hover:bg-red-700 focus:outline-none">Logout</button>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t py-4 text-center text-gray-500 text-sm">
    &copy; 2025 Simple Blog. All rights reserved.
  </footer>

</body>
</html>
