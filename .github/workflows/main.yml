name: Login-Register-Page-CI-Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Go
              uses: actions/setup-go@v2
              with:
                  go-version: 1.24.1

            - name: Set up Makefile
              uses: arduino/setup-makefile@v1
              with:
                  version: latest

            - name: Install dependencies
              working-directory: ./backend
              run: make install

            - name: Build
              working-directory: ./backend
              run: make build

            - name: Test
              working-directory: ./backend
              run: make test