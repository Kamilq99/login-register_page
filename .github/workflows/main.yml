name: Login-Register-Page-CI-Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            
            - name: Setup .NET Core
              uses: actions/setup-dotnet@v1
              with:
                  dotnet-version: '9.0.203'

            - name: Restore dependencies
              run: dotnet restore

            - name: Test Workflow
              run: echo "It's working!"